[tox]
env_list =
    # All Pythons, oldest Django
    {py312,py313,py314,py315}-django52-minioknown
    # Newest Python, all Djangos
    py315-django{52,60,61}-minioknown
    # Newest Python, newest Django, newest Minio
    py315-django61-minio
    lint
    docs
    pyright

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315, lint, docs, pyright

[testenv]
package = wheel
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    MINIO_STORAGE_ENDPOINT = {env:MINIO_STORAGE_ENDPOINT:localhost:9153}
    MINIO_STORAGE_ACCESS_KEY = {env:MINIO_STORAGE_ACCESS_KEY:weak_access_key}
    MINIO_STORAGE_SECRET_KEY = {env:MINIO_STORAGE_SECRET_KEY:weak_secret_key}
    TOX_ENVNAME = {envname}
deps =
    django52: Django==5.2.*
    django60: Django==6.0.*
    django61: Django==6.1.*
    minio: minio
    minioknown: minio==7.2.11
    -rdev-requirements.txt
commands =
    pytest {posargs}

[testenv:py313-django52-minioknown]
commands =
    pytest --cov --cov-append --cov-report=term-missing {posargs}

[testenv:coverage-report]
package = skip
depends = py313-django52-minioknown
deps =
    coverage[toml]
commands =
    coverage report
    coverage html

[testenv:pyright]
package = editable
depends = py313-django52-minio
deps =
    pyright
    django-stubs==6.1.*
    types-requests
    -rdev-requirements.txt
commands =
    pyright --level WARNING

[testenv:lint]
package = skip
set_env=
    PYTHONWARNINGS = ignore
deps =
    ruff==0.11.8
commands =
    ruff check
    ruff format --check

[testenv:fmt]
package = skip
set_env=
    PYTHONWARNINGS = ignore
deps =
    ruff==0.11.8
commands =
    ruff check --fix-only
    ruff format

[testenv:docs]
package = skip
deps =
    mkdocs
commands =
    mkdocs build
